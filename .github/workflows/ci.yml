# SPDX-License-Identifier: GPL-2.0-only
# CI: the audit, the docs check and the scripts' tests, on every push, with none of the game's files.
# The translator and the game need the disc, so they aren't built here: those checks are in
# docs/build-and-test-reference.md ("Before a commit"). There's no pull_request trigger: the project
# works on main only, and on a pull request HEAD is GitHub's own merge commit, which the audit rejects.
name: CI

on:
  push:

permissions:
  contents: read

jobs:
  audit-and-scripts:
    name: Audit and scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0  # every commit, so the audit can check their authors and messages
      - name: Audit
        env:
          JGR_AUDIT_DENYLIST: ${{ secrets.AUDIT_DENYLIST }}
        run: python3 scripts/audit_repo.py . --commits HEAD
      - name: Documents
        run: python3 scripts/check_docs.py .
      - name: Scripts' tests
        run: python3 -m unittest discover -s tests
      - name: Shell syntax
        run: for script in scripts/*.sh packaging/*.sh; do bash -n "$script"; done
      - name: ShellCheck
        run: shellcheck scripts/*.sh packaging/*.sh
